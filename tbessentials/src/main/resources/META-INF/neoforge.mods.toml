modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "AJ"
description = '''Adds four new upgrades to Traveler's Backpack: Anvil, Stonecutter, Smithing Table and Brewing Stand.

Slot an upgrade into your backpack and use the real workstation anywhere, no block needed. The Brewing Stand keeps brewing while you wear the backpack.

Requires Traveler's Backpack.'''

