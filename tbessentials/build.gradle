plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'com.tbadditional'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    compileOnly files("libs/${tb_jar}")
    runtimeOnly files("libs/${tb_jar}")
}

tasks.withType(ProcessResources).configureEach {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
