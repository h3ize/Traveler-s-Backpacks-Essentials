name: Build mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        id: find
        run: |
          settings=$(grep -rl --include=settings.gradle "rootProject.name = 'tbadditional'" . | head -n 1)
          if [ -z "$settings" ]; then
            echo "settings.gradle for tbadditional not found"
            exit 1
          fi
          echo "dir=$(dirname "$settings")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tbadditional-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
